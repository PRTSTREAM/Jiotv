name: Update Sportlink M3U Playlist with Multikeys

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate M3U Playlist
        run: |
          python -c '
          import urllib.request
          import json
          import os

          url = "https://sportlink-tv10.pages.dev/Star3.json"
          
          try:
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req) as response:
                  data = json.loads(response.read().decode())
          except Exception as e:
              print(f"Error fetching JSON: {e}")
              exit(1)

          m3u_lines = ["#EXTM3U"]

          for channel in data.get("channels", []):
              base_name = channel.get("name", "Unknown")
              logo = channel.get("logo", "")
              stream_url = channel.get("stream_url", "")
              cookie = channel.get("cookie", "")
              sportlinks = channel.get("sportlink", [])
              
              key_id = channel.get("key_id", "")
              key = channel.get("key", "")
              
              name = f"{base_name} [Jio tv]"
              
              m3u_lines.append(f"#EXTINF:-1 group-title=\"Sports\" tvg-logo=\"{logo}\",{name}")
              m3u_lines.append("#KODIPROP:inputstream.adaptive.license_type=clearkey")
              
              if sportlinks:
                  primary_combo = f"{key_id}:{key}"
                  all_keys = ",".join(sportlinks) if sportlinks else primary_combo
                  m3u_lines.append(f"#KODIPROP:inputstream.adaptive.license_key={all_keys}")
              else:
                  m3u_lines.append(f"#KODIPROP:inputstream.adaptive.license_key={key_id}:{key}")

              m3u_lines.append("#KODIPROP:inputstream=inputstream.adaptive")
              m3u_lines.append("#KODIPROP:inputstream.adaptive.manifest.type=mpd")
              m3u_lines.append("#EXTVLCOPT:http-user-agent=Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36")
              
              if cookie:
                  ext_http = json.dumps({"Cookie": cookie})
                  m3u_lines.append(f"#EXTHTTP:{ext_http}")
              
              m3u_lines.append(stream_url)

          os.makedirs("playlist", exist_ok=True)
          with open("playlist/sports.m3u", "w", encoding="utf-8") as f:
              f.write("\n".join(m3u_lines))
          print("Playlist with multikeys generated successfully!")
          '

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist/sports.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update sports M3U playlist with multikeys" && git push)
